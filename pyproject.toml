[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finmteb-sota-reranker"
version = "0.1.0"
description = "Reproducible FinanceMTEB Chinese reranker training and evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=3.6.0",
  "huggingface-hub>=0.31.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.2",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
eval = [
  "sentence-transformers>=5.1.0",
  "torch>=2.5.0",
  "transformers>=4.51.0",
  "peft>=0.15.0",
]
train = [
  "accelerate>=1.8.0",
  "bitsandbytes>=0.46.0; platform_system == 'Linux'",
  "sentence-transformers>=5.1.0",
  "torch>=2.5.0",
  "transformers>=4.51.0",
  "peft>=0.15.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

